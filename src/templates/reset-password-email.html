<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Reset your password</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f4f7;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="padding: 24px 0"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="480"
            cellpadding="0"
            cellspacing="0"
            style="
              background-color: #ffffff;
              border-radius: 8px;
              padding: 32px;
            "
          >
            <tr>
              <td>
                <h1 style="color: #212529; font-size: 22px; margin: 0 0 16px">
                  Hi {{username}},
                </h1>
                <p style="color: #495057; font-size: 15px; line-height: 22px">
                  We received a request to reset the password for your
                  NoteHub account. Click the button below to choose a new
                  password. This link will expire in 15 minutes.
                </p>
                <p style="text-align: center; margin: 32px 0">
                  <a
                    href="{{{resetLink}}}"
                    style="
                      background-color: #0d6efd;
                      color: #ffffff;
                      text-decoration: none;
                      padding: 12px 24px;
                      border-radius: 4px;
                      font-size: 15px;
                      display: inline-block;
                    "
                    >Reset password</a
                  >
                </p>
                <p style="color: #868e96; font-size: 13px; line-height: 20px">
                  If you didn't request a password reset, you can safely
                  ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
